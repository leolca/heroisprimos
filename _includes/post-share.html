<div class="post-share">
  <div class="post-date">{{ site.data.settings.sharing_button_prompt }}</div>
  <div class="sharing-icons">
    <a href="https://x.com/intent/tweet?text={{ page.title }}&url={{ site.baseurl }}{% if site.baseurl != '' %}/{% endif %}{{ page.url }}" target="_blank" rel="noopener"><i class="fa-brands fa-x-twitter" aria-hidden="true"></i></a>
    <a href="https://www.facebook.com/sharer/sharer.php?u={{ site.baseurl }}{% if site.baseurl != '' %}/{% endif %}{{ page.url }}&title={{ page.title }}" target="_blank" rel="noopener"><i class="fa-brands fa-facebook" aria-hidden="true"></i></a>
  </div>
</div>
