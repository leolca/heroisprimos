<article>
  <a href="{{ site.baseurl }}{% if site.baseurl != '' %}/{% endif %}{{ post.url }}">
    <div class="featured-post" {% if post.image %}style="background-image:url({{ site.baseurl }}{% if site.baseurl != '' %}/{% endif %}assets/img/{{ post.image }})"{% endif %}>
      <h2><span>{{ post.title }}</span></h2>
    </div>
  </a>
</article>
