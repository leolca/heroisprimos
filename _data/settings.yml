# Change 'comments' to true for Disqus comments
disqus:
  comments: false
  disqus_shortname: 'heroisprimos'

# If you are not using Google Analytics, please change 'google-ID' to an empty string
google-ID: ''

# Site logo (place in assets/img/)
logo: 'logo.svg'  # Uncomment and set filename to use logo instead of text title

menu:
- {name: 'Sobre',     url: 'about'}
- {name: 'Quadrinhos', url: 'quadrinhos'}
- {name: 'Contato',   url: 'contact'}

# Available social icons are powered by Font Awesome, so you can use any icon that they offer
social:
- {icon: 'github',     link: 'https://github.com/leolca/heroisprimos'}
- {icon: 'x-twitter',  link: 'https://x.com/heroisprimos'}
- {icon: 'instagram',  link: 'https://instagram.com/heroisprimos'}
- {icon: 'envelope',   link: 'mailto:osheroisprimos@gmail.com'}

# Customize site text
pagination:
  next_page: 'Mais Novos'
  previous_page: 'Mais Antigos'

sharing_button_prompt: 'Compartilhe esta aventura!'

related_posts: 'Você também pode gostar...'

post_date_prefix: 'Publicado em'
